{% extends "base.html" %}

{% block title %}Not Found (404) - SecretComm AI{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="card card-custom p-5">
            <h1 class="display-1 text-warning fw-bold"><i class="bi bi-question-circle"></i> 404</h1>
            <h3 class="text-light">Resource Not Found</h3>
            <p class="text-muted">The requested stego-image, secret package, or endpoint does not exist or has been removed.</p>
            <div class="mt-3">
                <a href="{{ url_for('communication.dashboard') }}" class="btn btn-outline-info">Return to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

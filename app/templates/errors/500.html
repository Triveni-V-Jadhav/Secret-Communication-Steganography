{% extends "base.html" %}

{% block title %}Server Error (500) - SecretComm AI{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="card card-custom p-5">
            <h1 class="display-1 text-danger fw-bold"><i class="bi bi-exclamation-triangle"></i> 500</h1>
            <h3 class="text-light">Internal Server Error</h3>
            <p class="text-muted">A server-side exception occurred. The system has logged the event and protected application integrity.</p>
            <div class="mt-3">
                <a href="{{ url_for('communication.dashboard') }}" class="btn btn-outline-info">Return to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
